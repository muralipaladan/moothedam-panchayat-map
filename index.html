<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>മൂത്തേടം പഞ്ചായത്ത് · Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #map { height: 100%; width: 100%; }

    /* Compact Google-Maps style top bar */
    .topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      background: #fff; color: #202124;
      padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      gap: 6px;
    }
    .topbar h1 {
      font-size: 0.95rem; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .topbar .sub { display: none; }

    /* Icon buttons – Google Maps style */
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; flex-shrink: 0;
      color: #5f6368;
    }
    .icon-btn:active, .icon-btn.active { background: #e8f0fe; color: #1a73e8; }
    .icon-btn.primary { background: #1a73e8; color: #fff; }

    .btn-group { display: flex; gap: 6px; }

    /* Floating right-side controls — 4th zone of 5 vertical parts */
    .fab-stack {
      position: absolute;
      top: 58%;
      right: 14px;
      transform: translateY(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Google Maps style location button */
    .icon-btn.locate-btn {
      background: #fff;
      color: #1a73e8;
    }
    .icon-btn.locate-btn svg {
      width: 22px; height: 22px;
    }
    .icon-btn.locate-btn.active,
    .icon-btn.locate-btn:active {
      background: #e8f0fe;
      color: #1a73e8;
    }

    /* Ward name labels at polygon centers */
    .ward-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-weight: 700;
      color: #1a237e;
      text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff,
         0 0 4px rgba(255,255,255,0.9);
      white-space: nowrap;
      pointer-events: none;
      text-align: center;
      line-height: 1.15;
    }
    .ward-label .ward-no {
      display: block;
      font-size: 0.85em;
      opacity: 0.9;
    }

    /* Side panel */
    .side-panel {
      position: absolute; top: 56px; right: 8px; z-index: 1000;
      width: 280px; max-width: calc(100vw - 16px);
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      max-height: calc(100vh - 80px); overflow-y: auto; display: none;
    }
    .side-panel.open { display: block; }
    .side-panel h2 {
      background: #1a73e8; color: #fff;
      padding: 12px 14px; font-size: 0.95rem;
      border-radius: 12px 12px 0 0;
    }
    .side-panel .body { padding: 12px; }

    .note-item {
      border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 10px; margin-bottom: 10px; background: #fafafa;
    }
    .note-item .meta { font-size: 0.75rem; color: #777; margin-bottom: 4px; }
    .note-item textarea {
      width: 100%; border: 1px solid #ccc; border-radius: 4px;
      padding: 6px; font-size: 0.85rem; resize: vertical; min-height: 50px;
    }
    .note-actions { display: flex; gap: 6px; margin-top: 6px; }
    .note-actions button {
      flex: 1; padding: 6px; border: none; border-radius: 4px;
      cursor: pointer; font-size: 0.8rem;
    }
    .save-btn { background: #34a853; color: #fff; }
    .del-btn { background: #ea4335; color: #fff; }

    .add-pin-hint {
      position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(26,115,232,0.95); color: #fff;
      padding: 8px 14px; border-radius: 20px; font-size: 0.8rem;
      display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.25); white-space: nowrap;
    }

    /* Popup */
    .popup-content { min-width: 210px; font-size: 0.88rem; }
    .popup-content h3 { margin: 0 0 6px; color: #1a73e8; font-size: 1rem; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.72rem; color: #fff; margin-bottom: 6px;
    }
    .badge-inc { background: #1a73e8; }
    .badge-iuml { background: #34a853; }
    .badge-cpim { background: #ea4335; }
    .badge-ind { background: #9c27b0; }
    .popup-row { display: flex; justify-content: space-between; margin: 3px 0; gap: 8px; }
    .popup-row span:first-child { color: #5f6368; flex-shrink: 0; }
    .nav-btn {
      display: block; width: 100%; margin-top: 8px; padding: 8px;
      background: #1a73e8; color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }

    /* Hide default leaflet attribution a bit */
    .leaflet-control-attribution { font-size: 9px !important; }
  </style>
</head>
<body>
  <!-- Compact top bar -->
  <div class="topbar">
    <h1>മൂത്തേടം പഞ്ചായത്ത്</h1>
    <div class="btn-group">
      <button class="icon-btn" id="btnNotes" title="Notes">📝</button>
      <button class="icon-btn" id="btnExport" title="Export notes">⬇️</button>
      <button class="icon-btn" id="btnImport" title="Import notes">⬆️</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </div>

  <div id="map"></div>

  <!-- Floating action buttons (Google Maps style) -->
  <div class="fab-stack">
    <button class="icon-btn locate-btn" id="btnLocate" title="My Location" aria-label="My Location">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnAddPin" title="Add Note / Pin" aria-label="Drop Pin">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#ea4335" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </button>
  </div>

  <div class="add-pin-hint" id="pinHint">മാപ്പിൽ tap ചെയ്ത് pin വയ്ക്കുക</div>

  <div class="side-panel" id="notesPanel">
    <h2>📌 Saved Notes / Pins</h2>
    <div class="body" id="notesList">
      <p style="color:#777;font-size:0.85rem">No notes yet. Use 📌 button.</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
  <script>
    // Base layers
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' });
    const googleRoad = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' });
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' });
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });

    const map = L.map('map', {
      center: [11.333, 76.326],
      zoom: 13,
      layers: [googleHybrid],
      zoomControl: false,
      attributionControl: true
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.layers({
      "Google Hybrid": googleHybrid,
      "Google Road": googleRoad,
      "OpenStreetMap": osm,
      "Esri Satellite": esriSat
    }, null, { position: 'topright' }).addTo(map);

    // Locate control (hidden, we use our own button)
    const locateControl = L.control.locate({
      position: 'bottomright',
      strings: { title: "Show my location" },
      locateOptions: { enableHighAccuracy: true, maxZoom: 16 },
      flyTo: true,
      showPopup: false,
      markerStyle: { color: '#1a73e8', fillColor: '#4285f4' },
      circleStyle: { color: '#1a73e8', fillColor: '#4285f4', fillOpacity: 0.15 }
    });
    // keep it in DOM but we trigger via our button
    locateControl.addTo(map);
    // hide the default locate button
    document.querySelector('.leaflet-control-locate')?.style.setProperty('display', 'none');

    document.getElementById('btnLocate').onclick = () => locateControl.start();

    // Colors for individual wards (when ward polygons with ward_no exist)
    const boundaryColors = ['#e53935', '#1e88e5', '#43a047', '#8e24aa', '#fb8c00', '#00acc1', '#d81b60', '#5e35b1'];

    function wardStyle(feature) {
      const p = feature.properties || {};
      // Individual ward with ward_no → colored boundary
      if (p.ward_no != null) {
        const color = boundaryColors[Number(p.ward_no) % boundaryColors.length];
        return {
          fillColor: color,
          fillOpacity: 0.12,
          weight: 2.5,
          opacity: 0.95,
          color: color
        };
      }
      // Whole panchayat boundary (current data)
      return {
        color: '#0d47a1',
        weight: 3.5,
        fillColor: '#1a73e8',
        fillOpacity: 0.08,
        opacity: 0.95
      };
    }

    function highlightFeature(e) {
      const layer = e.target;
      layer.setStyle({ weight: 5, opacity: 1 });
      layer.bringToFront();
    }
    function resetHighlight(e) {
      if (wardsLayer) wardsLayer.resetStyle(e.target);
    }

    function buildPopup(feature, layer) {
      const p = feature.properties || {};
      // Case 1: Full ward member data available
      if (p.ward_no != null || p.ward_name || p.member_ml || p.party) {
        const badgeClass = p.party === 'INC' ? 'badge-inc' :
                           p.party === 'IUML' ? 'badge-iuml' :
                           p.party === 'CPI(M)' ? 'badge-cpim' : 'badge-ind';
        return `<div class="popup-content">
          <h3>Ward ${p.ward_no || ''}: ${p.ward_name || p.name || ''}</h3>
          <span class="badge ${badgeClass}">${p.party_full || p.party || ''}</span>
          <div class="popup-row"><span>Member</span><strong>${p.member_ml || ''}</strong></div>
          <div class="popup-row"><span></span><small>${p.member_en || ''}</small></div>
          <div class="popup-row"><span>Age / Gender</span><span>${p.age || ''} ${p.gender ? ', ' + p.gender : ''}</span></div>
          <div class="popup-row"><span>House</span><span>${p.house || ''}</span></div>
          <div class="popup-row"><span>Symbol</span><span>${p.symbol || ''}</span></div>
          <div class="popup-row"><span>Ward Code</span><span>${p.ward_code || ''}</span></div>
          <div class="popup-row"><span>Voters</span><span>${p.total_pop || 0} (M:${p.males || 0} F:${p.females || 0})</span></div>
          <button class="nav-btn" onclick="navigateTo(${layer.getBounds().getCenter().lat}, ${layer.getBounds().getCenter().lng})">🧭 Navigate</button>
        </div>`;
      }
      // Case 2: Only panchayat boundary (current situation)
      return `<div class="popup-content">
        <h3>${p.name || 'Moothedam'} Grama Panchayat</h3>
        <div class="popup-row"><span>District</span><strong>Malappuram</strong></div>
        <div class="popup-row"><span>Block</span><strong>Nilambur</strong></div>
        <div class="popup-row"><span>Type</span><span>Grama Panchayat</span></div>
        <p style="margin-top:8px;font-size:0.8rem;color:#666">
          Individual ward polygons + member details are not yet loaded.<br>
          Add a proper wards GeoJSON with ward_no, member names etc. to enable full details.
        </p>
        <button class="nav-btn" onclick="navigateTo(${layer.getBounds().getCenter().lat}, ${layer.getBounds().getCenter().lng})">🧭 Navigate</button>
      </div>`;
    }

    let wardsLayer;

    // Load main boundary / wards
    fetch('wards_final.geojson')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        wardsLayer = L.geoJSON(data, {
          style: wardStyle,
          onEachFeature: (feature, layer) => {
            layer.bindPopup(buildPopup(feature, layer), { maxWidth: 280 });
            layer.on({
              mouseover: highlightFeature,
              mouseout: resetHighlight,
              click: () => layer.openPopup()
            });
          }
        }).addTo(map);

        // Ward name labels at polygon centers (zoom-responsive)
        const labelLayer = L.layerGroup().addTo(map);
        const labelMarkers = [];

        function getLabelFontSize(zoom) {
          if (zoom >= 16) return 14;
          if (zoom >= 15) return 13;
          if (zoom >= 14) return 12;
          if (zoom >= 13) return 11;
          if (zoom >= 12) return 10;
          return 9;
        }

        function refreshLabels() {
          const z = map.getZoom();
          const fs = getLabelFontSize(z);
          labelMarkers.forEach(m => {
            const el = m.getElement();
            if (el) {
              const label = el.querySelector('.ward-label');
              if (label) label.style.fontSize = fs + 'px';
            }
          });
          // Hide labels when zoomed too far out
          if (z < 12) labelLayer.remove();
          else if (!map.hasLayer(labelLayer)) labelLayer.addTo(map);
        }

        data.features.forEach(f => {
          const p = f.properties || {};
          if (p.ward_no == null) return;
          const center = L.geoJSON(f).getBounds().getCenter();
          const name = p.ward_name || p.name || '';
          const m = L.marker(center, {
            interactive: false,
            keyboard: false,
            icon: L.divIcon({
              className: '',
              html: `<div class="ward-label" style="font-size:${getLabelFontSize(map.getZoom())}px">
                       <span class="ward-no">${p.ward_no}</span>${name}
                     </div>`,
              iconSize: [120, 36],
              iconAnchor: [60, 18]
            })
          });
          labelMarkers.push(m);
          m.addTo(labelLayer);
        });

        map.on('zoomend', refreshLabels);
        refreshLabels();

        map.fitBounds(wardsLayer.getBounds().pad(0.06));
      })
      .catch(e => console.error('Wards/Boundary error:', e));

    // Neighbouring panchayats
    fetch('neighbors_final.geojson')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        L.geoJSON(data, {
          style: (f) => {
            // Skip drawing Moothedam again (already drawn from wards_final)
            if (f.properties.name === 'Moothedam') {
              return { color: '#0d47a1', weight: 0, fill: false, opacity: 0 };
            }
            return {
              color: '#e65100',
              weight: 2,
              fillColor: '#fff3e0',
              fillOpacity: 0.08,
              dashArray: '7 4',
              opacity: 0.85
            };
          },
          onEachFeature: (f, layer) => {
            if (f.properties.name !== 'Moothedam') {
              layer.bindTooltip(f.properties.name + ' Panchayat', {
                sticky: true,
                direction: 'top'
              });
            }
          }
        }).addTo(map);
      })
      .catch(e => console.error('Neighbors error:', e));

    window.navigateTo = function(lat, lng) {
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, '_blank');
    };

    // ===== Notes system =====
    const STORAGE_KEY = 'moothedam_notes_v1';
    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let noteMarkers = [];
    let addPinMode = false;
    let tempMarker = null;

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      renderNotesList();
    }

    function renderNoteMarkers() {
      noteMarkers.forEach(m => map.removeLayer(m));
      noteMarkers = [];
      notes.forEach((n, idx) => {
        const m = L.marker([n.lat, n.lng], {
          draggable: true,
          icon: L.divIcon({
            className: '',
            html: `<div style="width:28px;height:36px;position:relative">
              <svg viewBox="0 0 24 36" width="28" height="36" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35))">
                <path fill="#ea4335" stroke="#fff" stroke-width="1.2"
                  d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"/>
                <circle cx="12" cy="12" r="5" fill="#fff"/>
              </svg>
            </div>`,
            iconSize: [28, 36], iconAnchor: [14, 36]
          })
        }).addTo(map);
        m.bindPopup(`<strong>${n.title || 'Note'}</strong><br>${n.text || ''}<br><small>${n.lat.toFixed(5)}, ${n.lng.toFixed(5)}</small><br>
          <button onclick="editNote(${idx})" style="margin-top:6px;padding:4px 8px">Edit</button>
          <button onclick="deleteNote(${idx})" style="margin-top:6px;padding:4px 8px;background:#ea4335;color:white;border:none;border-radius:4px">Delete</button>`);
        m.on('dragend', e => {
          const pos = e.target.getLatLng();
          notes[idx].lat = pos.lat; notes[idx].lng = pos.lng;
          saveNotes();
        });
        noteMarkers.push(m);
      });
    }

    function renderNotesList() {
      const list = document.getElementById('notesList');
      if (notes.length === 0) {
        list.innerHTML = '<p style="color:#777;font-size:0.85rem">No notes yet. Use 📌 button.</p>';
        return;
      }
      list.innerHTML = notes.map((n, i) => `
        <div class="note-item">
          <div class="meta">${n.lat.toFixed(5)}, ${n.lng.toFixed(5)} · ${new Date(n.ts).toLocaleString()}</div>
          <input type="text" value="${(n.title || '').replace(/"/g, '"')}" placeholder="Title"
            onchange="updateNoteTitle(${i}, this.value)"
            style="width:100%;margin-bottom:4px;padding:4px;border:1px solid #ccc;border-radius:4px" />
          <textarea onchange="updateNoteText(${i}, this.value)">${n.text || ''}</textarea>
          <div class="note-actions">
            <button class="save-btn" onclick="flyToNote(${i})">Go to</button>
            <button class="del-btn" onclick="deleteNote(${i})">Delete</button>
          </div>
        </div>`).join('');
    }

    window.updateNoteTitle = (i, v) => { notes[i].title = v; saveNotes(); };
    window.updateNoteText = (i, v) => { notes[i].text = v; saveNotes(); };
    window.flyToNote = (i) => map.flyTo([notes[i].lat, notes[i].lng], 16);
    window.deleteNote = (i) => {
      if (confirm('Delete this note?')) {
        notes.splice(i, 1); saveNotes(); renderNoteMarkers();
      }
    };
    window.editNote = (i) => {
      document.getElementById('notesPanel').classList.add('open');
      renderNotesList();
    };

    document.getElementById('btnAddPin').onclick = () => {
      addPinMode = !addPinMode;
      document.getElementById('btnAddPin').classList.toggle('active', addPinMode);
      document.getElementById('pinHint').style.display = addPinMode ? 'block' : 'none';
      if (!addPinMode && tempMarker) {
        map.removeLayer(tempMarker); tempMarker = null;
      }
    };

    map.on('click', e => {
      if (!addPinMode) return;
      if (tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker(e.latlng, { draggable: true }).addTo(map);
      const title = prompt('Note title (optional):', '');
      const text = prompt('Note text:', '');
      notes.push({
        lat: e.latlng.lat, lng: e.latlng.lng,
        title: title || 'Pin', text: text || '', ts: Date.now()
      });
      saveNotes(); renderNoteMarkers();
      addPinMode = false;
      document.getElementById('btnAddPin').classList.remove('active');
      document.getElementById('pinHint').style.display = 'none';
      if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    });

    document.getElementById('btnNotes').onclick = () => {
      document.getElementById('notesPanel').classList.toggle('open');
      renderNotesList();
    };

    document.getElementById('btnExport').onclick = () => {
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `moothedam_notes_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };

    document.getElementById('btnImport').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (Array.isArray(imported)) {
            notes = imported; saveNotes(); renderNoteMarkers();
            alert('Imported ' + notes.length + ' notes!');
          } else alert('Invalid file');
        } catch (err) { alert('Error reading file'); }
      };
      reader.readAsText(file);
    };

    renderNoteMarkers();
    renderNotesList();
  </script>
</body>
</html>
